<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  // ---------- FOUC prevention — runs synchronously, before <body> paints ----------
  // if a cached theme exists, apply its CSS variables to the root right
  // now, before the browser renders anything — so a returning visitor's
  // very first paint is already correct, no flash, no overlay shown at
  // all. if there's no cache (first visit, or a cleared one), show the
  // branded loading overlay instead, in the right day/night flavor based
  // on the visitor's local clock (checked synchronously too)
  (function () {
    var CACHE_KEY = 'cloverWeatherThemeCache';
    var cached = null;
    try {
      cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    } catch (e) {
      cached = null;
    }

    var hour = new Date().getHours();
    var isNightNow = hour < 6 || hour >= 20;

    // only trust the cached theme if it's still the right time-of-day —
    // otherwise a returning visitor from last night briefly sees last
    // night's colors/fonts before fresh data corrects it. if it's stale,
    // fall back to the neutral loading overlay instead of confidently
    // showing what we now know is probably the wrong theme.
    if (cached && cached.vars && cached.isNight === isNightNow) {
      var root = document.documentElement.style;
      for (var key in cached.vars) {
        if (Object.prototype.hasOwnProperty.call(cached.vars, key)) {
          root.setProperty(key, cached.vars[key]);
        }
      }
    } else {
      document.documentElement.classList.add(
        'show-loading-overlay',
        isNightNow ? 'loading-night' : 'loading-day'
      );
    }
  })();
</script>

  /* Meteocons' animated SVGs are drawn with a lot of built-in canvas
     padding (space reserved for the animation's motion -- bouncing
     raindrops, drifting clouds, etc.), so a plain <img> at a fixed size
     shows mostly empty space around a small glyph. This wrapper crops
     that padding away: overflow is hidden on a fixed-size box, and the
     image inside is scaled up past the box's edges so only the dense,
     central part of the artwork is visible. */
  .card-icon {
    display: inline-block;
    width: 44px;
    height: 44px;
    overflow: hidden;
    vertical-align: middle;
  }

  .card-icon img {
    display: block;
    width: 100%;
    height: 100%;
    transform: scale(1.45);
    transform-origin: center;

  }

  .map-tab.active {
    background: var(--bg-color);
    font-family: var(--font-body);
    color: #e4e8eb;
  }

  .map-panel {
    display: none;
  }

  .map-panel.active {
    display: block;
  }

  .map-panel iframe,
  .rainviewer-map {
    width: 100%;
    height: 420px;
    border: 0;
    border-radius: 8px;
    overflow: hidden;
    background: var(--card-color);
  }

  .map-attribution {
    margin-top: 0.5rem;
    font-size: 0.8rem;
    color: var(--muted-color);
    font-family: var(--font-details);
  }

  .radar-frame-time {
    margin-top: 0.5rem;
    font-size: 0.8rem;
    color: var(--muted-color);
    text-align: center;
  }

  /* leaflet zoom control — reskinned to follow the active theme instead
     of its default white-box look, so it stays legible across both the
     light and dark card themes. */
  .leaflet-control-zoom {
    border: none !important;
    border-radius: 8px !important;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4) !important;
  }

  .leaflet-control-zoom a,
  .leaflet-control-zoom a:link,
  .leaflet-control-zoom a:visited {
    background: var(--card-color) !important;
    color: var(--text-color) !important;
    border-bottom: 1px solid rgba(128, 128, 128, 0.3) !important;
  }

  .leaflet-control-zoom a:last-child {
    border-bottom: none !important;
  }

  .leaflet-control-zoom a:hover {
    background: var(--accent-color) !important;
    color: var(--bg-color) !important;
  }

.range-buttons {
    display: flex;
    justify-content: center;
    font-family: var(--font-details);
    flex-wrap: wrap;
    gap: 0.4rem;
    margin-bottom: 1rem;
  }

  .range-btn {
    background: rgba(255, 255, 255, 0.06);
    border: none;
    color: var(--muted-color);
    padding: 0.35rem 0.7rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.75rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .range-btn.active {
    background: var(--bg-color);
    color: #e4e8eb;
  }

  @media (max-width: 480px) {
    .range-buttons {
      gap: 0.3rem;
    }

    .range-btn {
      padding: 0.3rem 0.55rem;
      font-size: 0.7rem;
    }
  }
  
  .outlook-scroll {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    gap: 1rem;
    scrollbar-width: none;
  }

  .outlook-scroll::-webkit-scrollbar {
    display: none;
  }

  .outlook-slide {
    flex: 0 0 100%;
    scroll-snap-align: start;
    text-align: center;
  }

  .outlook-slide img {
    max-width: 100%;
    border-radius: 8px;
    display: block;
    margin: 0 auto;
  }

  .outlook-card .outlook-note {
    color: var(--muted-color);
    font-size: 0.8rem;
    margin-top: 0.75rem;
    font-family: var(--font-body);
  }

/* ---------- FOUC loading overlay ----------
   loading overlay for first time visitors or visits without cached data to rely on  */
#loading-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 0.75rem;
  opacity: 1;
  transition: opacity 0.7s ease;
  overflow: hidden;
}

html.show-loading-overlay #loading-overlay {
  display: flex;
}

#loading-overlay.hide {
  opacity: 0;
  pointer-events: none;
}

html.loading-day #loading-overlay {
  background: linear-gradient(180deg, #eef4fa 0%, #dce8f3 55%, #cfe0ee 100%);
  color: #3a5068;
}

html.loading-night #loading-overlay {
  background: linear-gradient(180deg, #0b0e1c 0%, #14112f 55%, #1c1846 100%);
  color: #f0eff6;
}
