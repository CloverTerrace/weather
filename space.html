<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stargazing & Space Weather</title>
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/space.css">
</head>
<body id="space-page">

  <!-- live sky render + HUD overlay, sits behind everything else -->
  <div class="sky-stage" aria-hidden="true">
    <img id="sky-render-img" class="sky-render-img" alt="">
    <div id="sky-overlay" class="sky-overlay"></div>
  </div>

  <!-- shared navbar -->
  <nav class="site-nav" aria-label="Clover Terrace Weather sections">
      <a href="index.html" class="nav-brand">
        <img src="icons/cloverwx.png" alt="" class="nav-brand-icon">
        <span></span>
      </a>

      <div class="nav-links">
          <a href="index.html" data-page="index.html">
            <img src="icons/thunderstorms-extreme.svg" alt="" class="nav-icon">Home
          </a>
          <a href="gardening.html" data-page="gardening.html">
            <img src="icons/pollen-flower.svg" alt="" class="nav-icon">Garden
          </a>
          <button type="button" class="nav-soon" data-coming-soon="Soundings">
            <img src="icons/windsock.svg" alt="" class="nav-icon">Soundings
          </button>
          <a href="space.html" data-page="space.html">
            <img src="icons/star.svg" alt="" class="nav-icon">Space
          </a>
      </div>
  </nav>

  <!-- Floating Modal for Clicked Celestial Bodies -->
  <div id="celestial-modal" class="space-card glass-modal hidden" aria-hidden="true">
    <button id="close-modal" class="close-btn" aria-label="Close">&times;</button>
    <div id="modal-content"></div>
  </div>

  <!-- Bottom Drawer for General Info -->
  <main id="info-drawer" class="bottom-drawer">
    <div class="drawer-drag-handle"></div>
    
    <header class="space-header">
      <h1>Stargazing & Space Weather</h1>
      <p id="apod-title"></p>
    </header>

    <div class="space-grid drawer-grid">
      <!-- 1. Constellations take priority -->
      <section class="space-card sky-card">
        <h2>Tonight's Constellations</h2>
        <ul id="constellation-list" class="constellation-list">
          <li>Checking seasonal constellations...</li>
        </ul>
      </section>

      <!-- 2. Kp Index moved down -->
      <section class="space-card kp-card">
        <h2>Geomagnetic Kp Index</h2>
        <div class="kp-glance">
          <div class="metric-value" id="kp-value">--</div>
          <div class="kp-chip" id="kp-chip" data-level="unknown">Fetching solar activity...</div>
        </div>
        <div class="kp-sparkline" id="kp-sparkline" aria-label="Recent Kp index trend"></div>
        <p class="kp-note" id="kp-dark-note"></p>
      </section>
    </div>
  </main>

  <script src="js/navigation.js"></script>
  <script src="js/space.js?v=5"></script>
  
</body>
</html>
