<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d17">
  <title>Stargazing & Space Weather</title>
  <link rel="stylesheet" href="css/navigation.css">
  <link rel="stylesheet" href="css/space.css">
</head>
<body id="space-page">

  <!-- live sky render + HUD overlay, pinned to the viewport, sits behind everything else -->
  <div class="sky-stage" aria-hidden="true">
    <img id="sky-render-img" class="sky-render-img" alt="">
    <div id="sky-overlay" class="sky-overlay"></div>
  </div>

  <!-- Full-width alert bar, only shown when the Kp index is high enough that aurora is actually likely -->
  <button type="button" id="kp-alert-bar" class="kp-alert-bar hidden">
    <svg class="kp-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
    <span class="kp-alert-copy">
      <strong id="kp-alert-headline" class="kp-alert-headline"></strong>
      <span id="kp-alert-body" class="kp-alert-body"></span>
    </span>
  </button>
