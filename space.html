<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clover Terrace — Space & Stargazing</title>
  <link rel="stylesheet" href="navigation.css">
  <link rel="stylesheet" href="space.css">
</head>
<body id="space-page">

  <!-- shared navbar -->
  <nav class="site-nav" aria-label="Clover Terrace Weather sections">
      <a href="index.html" class="nav-brand">
        <img src="icons/cloverwx.png" alt="" class="nav-brand-icon">
        <span></span>
      </a>

      <div class="nav-links">
          <a href="index.html" data-page="index.html">
            <img src="icons/thunderstorms-extreme.svg" alt="" class="nav-icon">Home
          </a>
          <a href="gardening.html" data-page="gardening.html">
            <img src="icons/pollen-flower.svg" alt="" class="nav-icon">Garden
          </a>
          <a href="space.html" data-page="space.html">
            <img src="icons/star.svg" alt="" class="nav-icon">Space
          </a>
          <button type="button" class="nav-soon" data-coming-soon="Soundings">
            <img src="icons/windsock.svg" alt="" class="nav-icon">Soundings
          </button>
      </div>
  </nav>

  <!-- Main Content Cards -->
  <main class="space-container">
    <header class="space-header">
      <h1>Stargazing & Space</h1>
      <p id="apod-title">Loading today's sky view...</p>
    </header>

    <div class="space-grid">
      <!-- Kp Index Card -->
      <section class="space-card">
        <h2>Geomagnetic Kp Index</h2>
        <div class="metric-value" id="kp-value">--</div>
        <p id="kp-status">Fetching solar activity...</p>
      </section>

      <!-- Moon Phase Card -->
      <section class="space-card">
        <h2>Moon Phase</h2>
        <div class="metric-value" id="moon-phase">--</div>
        <p id="moon-illumination">Calculating illumination...</p>
      </section>

      <!-- Visible Constellations Card -->
      <section class="space-card">
        <h2>Tonight's Sky Highlights</h2>
        <ul id="constellation-list">
          <li>Checking seasonal constellations...</li>
        </ul>
      </section>
    </div>
  </main>

  <script src="navigation.js"></script>
  <script src="space.js"></script>
</body>
</html>
