name: Deploy to Neocities

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-to-neocities
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website for Neocities
        run: |
          rm -rf _site
          mkdir -p _site

          cp index.html _site/
          cp manifest.json _site/
          cp suncalc.js _site/
          cp chart.umd.min.js _site/

          cp -R data _site/
          cp -R fonts _site/
          cp -R icons _site/
          cp -R scripts _site/

      - name: Get current weather data
        run: |
          curl -L "https://raw.githubusercontent.com/CloverTerrace/weather-data/main/data/weather.json" -o _site/data/weather.json
          curl -L "https://raw.githubusercontent.com/CloverTerrace/weather-data/main/data/history.json" -o _site/data/history.json
      - name: Make Neocities copy use local weather data
        run: |
          sed -i "s#const DATA_REPO_BASE = 'https://raw.githubusercontent.com/CloverTerrace/weather-data/main/data';#const DATA_REPO_BASE = 'data';#" _site/index.html
      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_KEY }}
          dist_dir: ./_site
          cleanup: false
          preview_before_deploy: true
