name: Update Weather Data

on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: weather-data-update
  cancel-in-progress: true

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Pull latest remote changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash || true
          git pull origin main --rebase
          git stash pop || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pillow boto3 netCDF4

      - name: Fetch WU backup data (always -- feeds dashboard's per-field backfill)
        continue-on-error: true
        env:
          WU_STATION_ID: ${{ secrets.WU_STATION_ID }}
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
        run: python scripts/fetch_weather_backup.py

      - name: Fetch latest camera snapshot
        continue-on-error: true
        env:
          ECOWITT_APP_KEY: ${{ secrets.ECOWITT_APP_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
        run: python scripts/fetch_camera.py

      - name: Fetch local forecast
        continue-on-error: true
        run: python scripts/fetch_forecast.py

      - name: Fetch air quality
        continue-on-error: true
        env:
          PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
        run: python scripts/fetch_air_quality.py

      - name: Fetch current SPC outlook
        continue-on-error: true
        run: python scripts/fetch_outlook.py

      - name: Fetch active weather alerts
        continue-on-error: true
        run: python scripts/fetch_alerts.py

      - name: Fetch SPC / NWS storm desk products
        continue-on-error: true
        run: python scripts/fetch_nws_products.py

      - name: Fetch CAPE (storm instability)
        continue-on-error: true
        run: python scripts/fetch_cape.py

      - name: Fetch aurora/Kp data
        continue-on-error: true
        run: python scripts/fetch_aurora.py

      - name: Fetch lightning GLM data
        continue-on-error: true
        run: python scripts/fetch_lightning_glm.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # weather.json / history.json are no longer committed here -- the
          # dashboard reads those straight from the CloverTerrace/weather-data
          # repo now, so this Action has no reason to touch them. Home-server
          # staleness is detected client-side (PRIMARY_STALE_MS in
          # index.html) against weather_wu.json below, not by this workflow.
          for f in data/weather_wu.json data/camera.jpg data/forecast.json data/outlook-day1.png data/outlook-day2.png data/outlook-day3.png data/outlook-day4.png data/outlook-day5.png data/outlook-day6.png data/outlook-day7.png data/outlook-day8.png data/outlook-day4-8.gif data/outlook-day4-8.png data/air_quality.json data/alerts.json data/nws_products.json data/aurora.json data/lightning_glm.json data/cape.json; do
            [ -f "$f" ] && git add "$f"
          done

          # Thunderstorm Outlook is a rolling set of 4-hour products. The
          # fetch script removes expired period PNGs and the deprecated
          # single-file output, so stage additions AND deletions here.
          git add -A -- data/outlook-thunderstorm-*.png data/outlook-thunderstorm.json data/outlook-thunderstorm.png 2>/dev/null || true

          git diff --cached --quiet || git commit -m "Update weather data [skip ci]"
          git push
