name: Update Weather Data

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  
concurrency:
  group: weather-data-update
  cancel-in-progress: false

jobs:
  update-weather:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Pull latest remote changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash || true
          git pull origin main --rebase
          git stash pop || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pillow

      - name: Check staleness / apply WU fallback if home server is down
        id: fallback
        env:
          WU_STATION_ID: ${{ secrets.WU_STATION_ID }}
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
          STALE_THRESHOLD_MINUTES: '20'
        run: |
          result=$(python scripts/check_and_fallback.py)
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: Fetch WU backup data (always -- feeds dashboard's per-field backfill)
        continue-on-error: true
        env:
          WU_STATION_ID: ${{ secrets.WU_STATION_ID }}
          WU_API_KEY: ${{ secrets.WU_API_KEY }}
        run: python scripts/fetch_weather_backup.py

      - name: Fetch latest camera snapshot
        continue-on-error: true
        env:
          ECOWITT_APP_KEY: ${{ secrets.ECOWITT_APP_KEY }}
          ECOWITT_API_KEY: ${{ secrets.ECOWITT_API_KEY }}
          ECOWITT_MAC: ${{ secrets.ECOWITT_MAC }}
        run: python scripts/fetch_camera.py

      - name: Fetch local forecast
        continue-on-error: true
        run: python scripts/fetch_forecast.py

      - name: Fetch air quality
        continue-on-error: true
        env:
          PURPLEAIR_API_KEY: ${{ secrets.PURPLEAIR_API_KEY }}
        run: python scripts/fetch_air_quality.py

      - name: Fetch current SPC outlook
        continue-on-error: true
        run: python scripts/fetch_outlook.py

      - name: Fetch active weather alerts
        continue-on-error: true
        run: python scripts/fetch_alerts.py

      - name: Fetch aurora/Kp data
        continue-on-error: true
        run: python scripts/fetch_aurora.py
        
      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Auxiliary files: always eligible to commit.
          for f in data/weather_wu.json data/camera.jpg data/forecast.json data/outlook-day1.png data/outlook-day2.png data/outlook-day3.png data/air_quality.json data/alerts.json data/aurora.json; do
            [ -f "$f" ] && git add "$f"
          done

          # weather.json / history.json: only commit these when the
          # staleness check actually applied a WU fallback. The rest of the
          # time, the home server owns these files exclusively.
          if [ "${{ steps.fallback.outputs.result }}" = "FALLBACK_APPLIED" ]; then
            git add data/weather.json data/history.json
          fi

          git diff --cached --quiet || git commit -m "Update weather data [skip ci]"
          git push
