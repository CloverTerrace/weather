name: Deploy to Neocities

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-to-neocities
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare website for Neocities
        run: |
          rm -rf _site
          mkdir -p _site

          cp index.html _site/
          cp manifest.json _site/
          cp suncalc.js _site/
          cp chart.umd.min.js _site/

          cp -R data _site/
          cp -R fonts _site/
          cp -R icons _site/
          cp -R scripts _site/
          cp -R css _site/
          cp -R js _site/

      - name: Fetch current weather data
        run: |
          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/CloverTerrace/weather-data/main/data/weather.json" \
            -o _site/data/weather.json || echo "Warning: Failed to fetch weather.json"

          curl --fail --silent --show-error --location \
            "https://raw.githubusercontent.com/CloverTerrace/weather-data/main/data/history.json" \
            -o _site/data/history.json || echo "Warning: Failed to fetch history.json"

      - name: Get current USGS river gauge data
        continue-on-error: true
        run: |
          curl --fail --show-error --location \
            "https://waterservices.usgs.gov/nwis/iv/?sites=03086000&parameterCd=00065,00060&format=json&period=P10D" \
            -o _site/data/usgs.json

      - name: Make Neocities copy use local data sources
        run: |
          # Replace DATA_REPO_BASE reference
          sed -i "s#const DATA_REPO_BASE = 'https://raw.githubusercontent.com/CloverTerrace/weather-data/main/data';#const DATA_REPO_BASE = 'data';#g" _site/index.html

          # Use Python to safely replace USGS URL (handles complex patterns better)
          python3 << 'PYTHON_SCRIPT'
          import re
          from pathlib import Path

          html_path = Path("_site/index.html")
          content = html_path.read_text()

          # Match the USGS URL pattern with flexibility for formatting/escaping
          usgs_pattern = r"const url = `https://waterservices\.usgs\.gov/nwis/iv/\?sites=\$\{USGS_SITE_ID\}[^`]+`;"
          replacement = "const url = 'data/usgs.json';"

          if re.search(usgs_pattern, content):
              new_content = re.sub(usgs_pattern, replacement, content)
              html_path.write_text(new_content)
              print("✓ Successfully updated USGS URL reference")
          else:
              print("⚠ Warning: Could not find USGS URL pattern in index.html")
              print("This may cause the river gauge to fail on Neocities.")
              # Continue anyway - don't fail the entire deploy
          PYTHON_SCRIPT

      - name: Verify local data files exist
        run: |
          echo "Checking required data files..."
          files=(
            "_site/data/weather.json"
            "_site/data/history.json"
            "_site/data/usgs.json"
            "_site/index.html"
            "_site/manifest.json"
          )
          
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              size=$(du -h "$file" | cut -f1)
              echo "✓ $file ($size)"
            else
              echo "⚠ Missing: $file"
            fi
          done

      - name: Deploy to Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_KEY }}
          dist_dir: ./_site
          cleanup: false
          preview_before_deploy: true
